name: C Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with warnings enabled
        run: make

      - name: Run test suite
        run: make test

      - name: Verify clean rebuild
        run: |
          make clean
          make
